spring.application.name=shaani

spring.datasource.url=jdbc:mysql://localhost:3306/shaani?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

shaani.jwt.expiration-ms=86400000
shaani.admin.username=admin
shaani.admin.notify-email=venkataniharbillakurthi@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=venkataniharbillakurthi@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

shaani.spaces.bucket=shaaniclothing
shaani.spaces.region=sgp1

spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
